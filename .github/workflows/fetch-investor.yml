name: NH Portfolio Fetch

# 이 저장소 루트의 nh_portfolio_fetch.py 를 정해진 시각에 자동 실행해서
# nh_data_latest.json 을 커밋합니다. 
#
# 시간대 주의: GitHub Actions cron은 UTC 기준이며, KST = UTC+9 입니다.
#  - 평일 "아침" 브리핑용: KST 06:50 실행 -> 날짜가 하루 당겨져서
#    UTC로는 "일~목 21:50"에 걸어야 KST 월~금 새벽이 됩니다.
#  - 평일 "장마감" 브리핑용: KST 15:35 실행 -> 같은 날짜라
#    UTC "월~금 06:35"에 걸면 됩니다.
on:
  schedule:
    - cron: '50 21 * * 0-4'    # KST 월~금 06:50 (아침 브리핑용)
    - cron: '35 6 * * 1-5'     # KST 월~금 15:35 (장마감 브리핑용)
  workflow_dispatch: {}        # 수동 실행 버튼(테스트용)

permissions:
  contents: write

concurrency:
  group: nh-portfolio-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv
          # 로컬에서 검증된 버전(0.4.1)으로 고정. 필요시 버전만 올려서 재검증하세요.
          pip install "nhplug==0.4.1" || pip install "git+https://github.com/PLUG-OpenAPI/nhplug-sdk"

      - name: Run fetch script
        env:
          # 저장소 Settings > Secrets and variables > Actions 에 등록한 값
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          # SDK 기본값과 동일. 나무증권이 아닌 N2 계좌라면 n2plug.com 계열로 교체
          NHPLUG_BASE_URL: https://api.nhplug.com:8443
          # 실행마다 새 토큰 발급(1일 2회 실행이라 캐시 불필요)
          NHPLUG_TOKEN_CACHE: '0'
        run: python nh_portfolio_fetch.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 새롭게 생성되는 email_body.txt도 함께 커밋되도록 추가
          git add nh_data_latest.json email_body.txt data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update portfolio data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          # 사용자가 같은 시점에 웹에서 다른 파일을 커밋하는 등으로 원격이
          # 앞서 나가 push가 거부될 수 있어(non-fast-forward), rebase 후 재시도한다.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패(원격이 앞서 있음) - rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "5회 재시도에도 push 실패"
          exit 1

      - name: Send Email Briefing via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 📊 [포트폴리오 브리핑] 최신 수급 및 시세 현황
          to: ${{ secrets.GMAIL_USER }}
          from: GitHub Actions
          body: file://email_body.txt
          attachments: nh_data_latest.json
